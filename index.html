<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML / CSS / JS Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    color: #222;
    margin: 0;
    padding: 2rem;
    transition: background 0.3s ease, color 0.3s ease;
  }
  h1 {
    color: #3b5bdb;
  }
  .card {
    background: white;
    border-radius: 8px;
    padding: 1.5rem;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  button {
    background: #3b5bdb;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover {
    background: #2f4bc0;
  }
  #box {
    width: 80px;
    height: 80px;
    background: tomato;
    border-radius: 8px;
    margin: 1rem auto;
    transition: transform 0.4s ease, background 0.4s ease;
  }
  .dark-mode {
    background: #1e1e2f;
    color: #eee;
  }
  .dark-mode .card {
    background: #2a2a3d;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>HTML / CSS / JS Demo</h1>
    <p>This page demonstrates how changing HTML, CSS, and JavaScript affects rendering in the browser.</p>

    <div id="box"></div>

    <button id="spinBtn">Spin the Box (JS + CSS)</button>
    <button id="themeBtn">Toggle Dark Mode (CSS class via JS)</button>

    <p id="counterText">Button clicks: <span id="counter">0</span></p>
  </div>

  <script>
    const box = document.getElementById('box');
    const counterEl = document.getElementById('counter');
    let clicks = 0;

    document.getElementById('spinBtn').addEventListener('click', () => {
      clicks++;
      counterEl.textContent = clicks;
      box.style.transform = `rotate(${clicks * 45}deg)`;
      box.style.background = `hsl(${(clicks * 40) % 360}, 70%, 55%)`;
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
